services:
  dsproxy:
    image: ghcr.io/mewisme/dsproxy:latest
    pull_policy: always
    container_name: dsproxy
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-9999}:9999"
    env_file:
      - .env
    environment:
      # Explicit overrides for container runtime.
      # The container always binds 0.0.0.0:9999; HOST_PORT controls
      # the published port on the host side only.
      HOST: "0.0.0.0"
      PORT: "9999"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9999/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - dsproxy-cache:/home/nonroot/.dsproxy
    networks:
      - dsproxy-network

volumes:
  dsproxy-cache:

networks:
  dsproxy-network:
    driver: bridge
