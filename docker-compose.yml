services:
  dsproxy:
    build: .
    image: dsproxy:local
    container_name: dsproxy
    restart: unless-stopped
    ports:
      - "${PORT:-9999}:9999"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "${PORT:-9999}"
      BASE_URL: "${BASE_URL:-https://api.deepseek.com}"
      MODEL: "${MODEL:-deepseek-v4-pro}"
      THINKING: "${THINKING:-enabled}"
      REASONING_EFFORT: "${REASONING_EFFORT:-max}"
      DISPLAY_REASONING: "${DISPLAY_REASONING:-true}"
      COLLAPSIBLE_REASONING: "${COLLAPSIBLE_REASONING:-true}"
      VERBOSE: "${VERBOSE:-false}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-300}"
      MAX_REQUEST_BODY_BYTES: "${MAX_REQUEST_BODY_BYTES:-20971520}"
      CORS: "${CORS:-false}"
      REASONING_CONTENT_PATH: "${REASONING_CONTENT_PATH:-/home/nonroot/.dsproxy/reasoning_content.sqlite3}"
      MISSING_REASONING_STRATEGY: "${MISSING_REASONING_STRATEGY:-recover}"
      REASONING_CACHE_MAX_AGE_SECONDS: "${REASONING_CACHE_MAX_AGE_SECONDS:-2592000}"
      REASONING_CACHE_MAX_ROWS: "${REASONING_CACHE_MAX_ROWS:-100000}"
      CLEAR_REASONING_CACHE: "${CLEAR_REASONING_CACHE:-false}"
      TRACE_DIR: "${TRACE_DIR:-}"
    volumes:
      - dsproxy-cache:/home/nonroot/.dsproxy

volumes:
  dsproxy-cache:
